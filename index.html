<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JEE Chapters | Complete Reference</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-body: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --bg-primary: #f8f7f4;
      --bg-secondary: #ffffff;
      --bg-tertiary: #eceae4;
      --bg-card: #ffffff;
      --bg-card-hover: #f5f3ee;
      --text-primary: #1a1a18;
      --text-secondary: #5c5c56;
      --text-tertiary: #8a8a82;
      --border-primary: #e0ddd6;
      --border-secondary: #eceae4;
      --accent-green: #2d8a6e;
      --accent-green-light: #e8f5f0;
      --accent-green-glow: rgba(45, 138, 110, 0.15);
      --accent-brown: #8b7355;
      --freq-high: #2d8a6e;
      --freq-med: #b8860b;
      --freq-low: #7a7a72;
      --diff-easy: #4a7bc7;
      --diff-med: #c75a9a;
      --diff-hard: #c75050;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.06);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-primary: #1a1b18;
        --bg-secondary: #232420;
        --bg-tertiary: #2d2e29;
        --bg-card: #262824;
        --bg-card-hover: #2e2f2a;
        --text-primary: #f0f0ec;
        --text-secondary: #a8a8a0;
        --text-tertiary: #6b6b63;
        --border-primary: #3a3a36;
        --border-secondary: #2d2e29;
        --accent-green: #4db894;
        --accent-green-light: rgba(77, 184, 148, 0.12);
        --accent-green-glow: rgba(77, 184, 148, 0.2);
        --accent-brown: #c4a77d;
        --freq-high: #4db894;
        --freq-med: #d4a029;
        --freq-low: #8a8a82;
        --diff-easy: #6b9bd4;
        --diff-med: #e076b5;
        --diff-hard: #e07070;
        --shadow-sm: 0 2px 8px rgba(0,0,0,0.2);
        --shadow-md: 0 4px 16px rgba(0,0,0,0.25);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      font-size: 15px;
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* ── Animated nature background ── */
    .bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .bg::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 100% 80% at 0% 0%, var(--accent-green-light) 0%, transparent 50%),
        radial-gradient(ellipse 60% 50% at 100% 100%, rgba(139,115,85,0.08) 0%, transparent 40%);
    }

    /* Floating leaf particles */
    .leaf {
      position: absolute;
      opacity: 0;
      animation: leafFall linear infinite;
      font-size: 14px;
      filter: blur(0px);
      user-select: none;
    }

    @keyframes leafFall {
      0%   { opacity: 0; transform: translateY(-40px) rotate(0deg) translateX(0px); }
      10%  { opacity: 0.35; }
      80%  { opacity: 0.2; }
      100% { opacity: 0; transform: translateY(100vh) rotate(720deg) translateX(60px); }
    }

    /* Gentle sway on the bg gradients */
    .bg-sway {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 40% 30% at 70% 30%, rgba(45,138,110,0.06) 0%, transparent 60%);
      animation: sway 8s ease-in-out infinite alternate;
    }

    @keyframes sway {
      0%   { transform: translate(0, 0) scale(1); }
      100% { transform: translate(20px, -10px) scale(1.05); }
    }

    /* ── Layout ── */
    .app {
      position: relative;
      z-index: 1;
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 24px 80px;
    }

    /* ── Header ── */
    .header {
      text-align: center;
      margin-bottom: 36px;
      animation: fadeUp 0.7s ease-out both;
    }

    .header-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      font-family: var(--font-mono);
      color: var(--accent-green);
      background: var(--accent-green-light);
      border: 1px solid var(--accent-green-glow);
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 14px;
      letter-spacing: 0.04em;
    }

    .header h1 {
      font-size: clamp(1.75rem, 4vw, 2.4rem);
      font-weight: 700;
      letter-spacing: -0.025em;
      margin-bottom: 8px;
      color: var(--text-primary);
    }

    .header p {
      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    /* Progress summary bar */
    .progress-summary {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 18px;
      animation: fadeUp 0.7s ease-out 0.1s both;
    }

    .prog-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      padding: 5px 14px;
      border-radius: 20px;
      border: 1px solid var(--border-primary);
      background: var(--bg-card);
      color: var(--text-secondary);
      font-family: var(--font-mono);
      box-shadow: var(--shadow-sm);
    }

    .prog-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .prog-dot.done  { background: var(--freq-high); }
    .prog-dot.wip   { background: var(--freq-med); }
    .prog-dot.todo  { background: var(--border-primary); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Tabs ── */
    .tabs-container {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
      animation: fadeUp 0.7s ease-out 0.15s both;
    }

    .tabs {
      display: flex;
      gap: 6px;
      padding: 6px;
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-primary);
      box-shadow: var(--shadow-sm);
    }

    .tab {
      padding: 10px 24px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-family: var(--font-body);
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      border-radius: var(--radius-md);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tab:hover { color: var(--text-primary); background: var(--bg-tertiary); }

    .tab.active {
      background: var(--accent-green);
      color: #ffffff;
      box-shadow: var(--shadow-sm);
    }

    /* ── Subtabs ── */
    #subtabs {
      display: none;
      justify-content: center;
      margin-bottom: 20px;
      animation: fadeUp 0.5s ease-out both;
    }

    #subtabs.visible { display: flex; }

    .subtabs {
      display: flex;
      gap: 4px;
      padding: 4px;
      background: var(--bg-secondary);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-secondary);
    }

    .stab {
      padding: 7px 16px;
      border: none;
      background: transparent;
      color: var(--text-tertiary);
      font-family: var(--font-body);
      font-size: 0.8rem;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s ease;
    }

    .stab:hover { color: var(--text-secondary); }

    .stab.active {
      background: var(--bg-tertiary);
      color: var(--text-primary);
      font-weight: 500;
    }

    /* ── Filters ── */
    .filters-container {
      margin-bottom: 28px;
      animation: fadeUp 0.7s ease-out 0.2s both;
    }

    .filters {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
      padding: 14px 18px;
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-primary);
      box-shadow: var(--shadow-sm);
    }

    .filters-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: center;
    }

    .filter-group { display: flex; gap: 5px; }
    .filter-divider { width: 1px; height: 20px; background: var(--border-secondary); margin: 0 6px; }

    .filter-btn {
      padding: 5px 14px;
      border-radius: 20px;
      border: 1px solid var(--border-secondary);
      background: transparent;
      color: var(--text-tertiary);
      font-family: var(--font-body);
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-btn:hover { border-color: var(--border-primary); color: var(--text-secondary); }
    .filter-btn.on { border-color: transparent; font-weight: 500; }
    .filter-btn.f-all.on { background: var(--bg-tertiary); color: var(--text-primary); }
    .filter-btn.f-high.on { background: var(--accent-green-light); color: var(--freq-high); border-color: var(--accent-green-glow); }
    .filter-btn.f-med.on  { background: rgba(255,176,32,0.12); color: var(--freq-med); border-color: rgba(255,176,32,0.25); }
    .filter-btn.f-low.on  { background: rgba(122,122,114,0.12); color: var(--freq-low); border-color: rgba(122,122,114,0.2); }
    .filter-btn.d-easy.on { background: rgba(74,123,199,0.12); color: var(--diff-easy); border-color: rgba(74,123,199,0.2); }
    .filter-btn.d-med.on  { background: rgba(199,90,154,0.12); color: var(--diff-med); border-color: rgba(199,90,154,0.2); }
    .filter-btn.d-hard.on { background: rgba(199,80,80,0.12); color: var(--diff-hard); border-color: rgba(199,80,80,0.2); }

    /* Status filter */
    .filter-btn.s-done.on { background: var(--accent-green-light); color: var(--freq-high); border-color: var(--accent-green-glow); }
    .filter-btn.s-wip.on  { background: rgba(255,176,32,0.12); color: var(--freq-med); border-color: rgba(255,176,32,0.25); }
    .filter-btn.s-todo.on { background: rgba(122,122,114,0.12); color: var(--freq-low); border-color: rgba(122,122,114,0.2); }

    .search-wrapper { position: relative; width: 100%; max-width: 340px; }

    .search {
      padding: 7px 14px 7px 36px;
      border-radius: 20px;
      border: 1px solid var(--border-secondary);
      background: var(--bg-secondary);
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 0.8rem;
      width: 100%;
      outline: none;
      transition: all 0.2s ease;
    }

    .search:focus { border-color: var(--accent-green); background: var(--bg-card); }
    .search::placeholder { color: var(--text-tertiary); }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-tertiary);
      font-size: 0.75rem;
      pointer-events: none;
    }

    /* ── Count ── */
    .count {
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-tertiary);
      margin-bottom: 20px;
      font-family: var(--font-mono);
    }

    /* ── Chapter list ── */
    #list { display: flex; flex-direction: column; gap: 4px; }

    .section-head {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-tertiary);
      letter-spacing: 0.07em;
      text-transform: uppercase;
      margin: 22px 0 8px;
      padding-left: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-head::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border-secondary);
    }

    .section-head:first-child { margin-top: 0; }

    /* ── Row (chapter card) ── */
    .row {
      background: var(--bg-card);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-secondary);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      animation: slideIn 0.35s ease-out both;
      overflow: hidden;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .row:hover { border-color: var(--border-primary); box-shadow: var(--shadow-sm); }
    .row.hidden { display: none; }

    /* Status accent on left edge */
    .row.status-done { border-left: 3px solid var(--freq-high); }
    .row.status-wip  { border-left: 3px solid var(--freq-med); }

    /* ── Row header (always visible) ── */
    .row-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 14px;
      cursor: pointer;
      user-select: none;
    }

    .row-header:hover { background: var(--bg-card-hover); }

    .num {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      color: var(--text-tertiary);
      min-width: 22px;
      text-align: center;
    }

    /* Status toggle button */
    .status-btn {
      width: 22px; height: 22px;
      border-radius: 50%;
      border: 1.5px solid var(--border-primary);
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      flex-shrink: 0;
      transition: all 0.18s ease;
      padding: 0;
    }

    .status-btn:hover { border-color: var(--accent-green); }
    .status-btn.done { background: var(--freq-high); border-color: var(--freq-high); color: #fff; }
    .status-btn.wip  { background: var(--freq-med);  border-color: var(--freq-med);  color: #fff; }
    .status-btn.todo { color: var(--text-tertiary); }

    .name {
      flex: 1;
      font-size: 0.88rem;
      color: var(--text-primary);
      font-weight: 500;
      line-height: 1.35;
    }

    .bar-bg {
      width: 70px; height: 4px;
      background: var(--bg-tertiary);
      border-radius: 3px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .bar-fill { height: 100%; border-radius: 3px; }

    .badges { display: flex; gap: 5px; flex-shrink: 0; }

    .badge {
      font-size: 0.62rem;
      padding: 3px 8px;
      border-radius: 10px;
      font-weight: 600;
      white-space: nowrap;
      font-family: var(--font-mono);
    }

    .fh { background: var(--accent-green-light); color: var(--freq-high); }
    .fm { background: rgba(255,176,32,0.12); color: var(--freq-med); }
    .fl { background: rgba(122,122,114,0.12); color: var(--freq-low); }
    .de { background: rgba(74,123,199,0.12); color: var(--diff-easy); }
    .dm { background: rgba(199,90,154,0.12); color: var(--diff-med); }
    .dh { background: rgba(199,80,80,0.12); color: var(--diff-hard); }

    .expand-icon {
      font-size: 10px;
      color: var(--text-tertiary);
      transition: transform 0.25s ease;
      flex-shrink: 0;
    }

    .row.open .expand-icon { transform: rotate(180deg); }

    /* ── Expanded panel ── */
    .row-detail {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.35s ease;
    }

    .row.open .row-detail { max-height: 600px; }

    .detail-inner {
      padding: 0 14px 14px 58px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border-top: 1px solid var(--border-secondary);
      padding-top: 12px;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 8px;
    }

    .detail-chip {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 8px 12px;
      background: var(--bg-tertiary);
      border-radius: var(--radius-sm);
      font-size: 0.75rem;
    }

    .detail-chip-label {
      font-size: 0.65rem;
      font-family: var(--font-mono);
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .detail-chip-val {
      font-weight: 600;
      color: var(--text-primary);
    }

    .detail-topics { font-size: 0.8rem; color: var(--text-secondary); }

    .detail-topics strong {
      display: block;
      font-size: 0.68rem;
      font-family: var(--font-mono);
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 5px;
    }

    .topic-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }

    .topic-tag {
      font-size: 0.72rem;
      padding: 2px 9px;
      border-radius: 8px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-secondary);
      color: var(--text-secondary);
    }

    /* Notes & date */
    .detail-notes-row {
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .notes-input {
      flex: 1;
      padding: 7px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-secondary);
      background: var(--bg-secondary);
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 0.78rem;
      resize: none;
      outline: none;
      min-height: 52px;
      transition: border-color 0.2s;
    }

    .notes-input:focus { border-color: var(--accent-green); }
    .notes-input::placeholder { color: var(--text-tertiary); }

    .date-input {
      padding: 7px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-secondary);
      background: var(--bg-secondary);
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 0.75rem;
      outline: none;
      transition: border-color 0.2s;
      width: 140px;
      flex-shrink: 0;
    }

    .date-input:focus { border-color: var(--accent-green); }

    .detail-label {
      font-size: 0.65rem;
      font-family: var(--font-mono);
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }

    .save-indicator {
      font-size: 0.65rem;
      color: var(--freq-high);
      font-family: var(--font-mono);
      opacity: 0;
      transition: opacity 0.3s;
      margin-top: 2px;
    }

    .save-indicator.show { opacity: 1; }

    /* Status row in detail */
    .status-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .status-option {
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid var(--border-secondary);
      background: transparent;
      color: var(--text-tertiary);
      font-size: 0.72rem;
      cursor: pointer;
      font-family: var(--font-body);
      transition: all 0.18s;
    }

    .status-option:hover { border-color: var(--border-primary); color: var(--text-secondary); }
    .status-option.active-done { background: var(--accent-green-light); color: var(--freq-high); border-color: var(--accent-green-glow); font-weight: 600; }
    .status-option.active-wip  { background: rgba(255,176,32,0.12); color: var(--freq-med); border-color: rgba(255,176,32,0.3); font-weight: 600; }
    .status-option.active-todo { background: var(--bg-tertiary); color: var(--text-secondary); border-color: var(--border-primary); font-weight: 600; }

    /* ── Empty state ── */
    .empty-state { text-align: center; padding: 48px 20px; color: var(--text-tertiary); }
    .empty-state-icon { font-size: 2.5rem; margin-bottom: 12px; opacity: 0.4; }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .app { padding: 24px 14px 60px; }
      .header { margin-bottom: 24px; }
      .tabs { flex-wrap: wrap; justify-content: center; }
      .tab { padding: 8px 16px; font-size: 0.8rem; }
      .tab-icon { display: none; }
      .filters { gap: 10px; padding: 14px; }
      .filters-row { gap: 6px; }
      .filter-group { flex-wrap: wrap; justify-content: center; }
      .filter-divider { display: none; }
      .search-wrapper { max-width: 100%; }
      .row-header { flex-wrap: wrap; gap: 8px; padding: 10px 12px; }
      .name { width: calc(100% - 80px); }
      .bar-bg { display: none; }
      .detail-inner { padding: 12px; }
      .detail-notes-row { flex-direction: column; }
      .date-input { width: 100%; }
    }

    @media (max-width: 480px) {
      .filter-btn { padding: 5px 10px; font-size: 0.7rem; }
      .badge { font-size: 0.58rem; padding: 2px 6px; }
      .progress-summary { gap: 8px; }
      .prog-chip { font-size: 0.72rem; padding: 4px 10px; }
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-secondary); }
    ::-webkit-scrollbar-thumb { background: var(--border-primary); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-tertiary); }
  </style>
</head>
<body>

<!-- Animated background -->
<div class="bg">
  <div class="bg-sway"></div>
</div>

<div class="app">

  <header class="header">
    <div class="header-badge">🌿 JEE Study Planner</div>
    <h1>JEE Chapter Reference</h1>
    <p>Complete guide — ranked by frequency & difficulty. Progress saves automatically.</p>
    <div class="progress-summary" id="progressSummary"></div>
  </header>

// ─────────────────────────────────────────────
// LOCALSTORAGE helpers
// ─────────────────────────────────────────────
const LS_KEY = 'jee_planner_v2';

function loadStorage() {
  try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; }
  catch { return {}; }
}

function saveStorage(data) {
  try { localStorage.setItem(LS_KEY, JSON.stringify(data)); }
  catch {}
}

function chapterKey(subj, groupName, chapterName) {
  return `${subj}__${groupName}__${chapterName}`;
}

// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
let subject = 'phy', subCat = 'all', freqF = 'all', diffF = 'all', statF = 'all';
const fCol = { H:"#2d8a6e", M:"#b8860b", L:"#7a7a72" };
const fClass = { H:"fh", M:"fm", L:"fl" };
const dClass = { E:"de", M:"dm", D:"dh" };
const fLabel = { H:"High", M:"Medium", L:"Low" };
const dLabel = { E:"Easy", M:"Medium", D:"Hard" };
const STATUS_ICONS = { done:"✓", wip:"⟳", todo:"" };

// ─────────────────────────────────────────────
// PROGRESS SUMMARY
// ─────────────────────────────────────────────
function updateProgressSummary() {
  const store = loadStorage();
  let done = 0, wip = 0, total = 0;
  Object.values(D).forEach(groups => {
    groups.forEach(g => {
      g.rows.forEach(r => {
        total++;
        const key = Object.keys(D).find(k => D[k] === groups);
        // find by iterating — simple approach
      });
    });
  });
  // Count across all
  done = 0; wip = 0; total = 0;
  ['phy','chem','math'].forEach(subj => {
    D[subj].forEach(g => {
      g.rows.forEach(r => {
        total++;
        const k = chapterKey(subj, g.g, r.n);
        const s = store[k]?.status || 'todo';
        if(s === 'done') done++;
        else if(s === 'wip') wip++;
      });
    });
  });
  const todo = total - done - wip;
  document.getElementById('progressSummary').innerHTML = `
    <div class="prog-chip"><span class="prog-dot done"></span>${done} Done</div>
    <div class="prog-chip"><span class="prog-dot wip"></span>${wip} In Progress</div>
    <div class="prog-chip"><span class="prog-dot todo"></span>${todo} Not Started</div>
    <div class="prog-chip">📊 ${Math.round(done/total*100)}% complete</div>
  `;
}

// ─────────────────────────────────────────────
// TOGGLE EXPAND
// ─────────────────────────────────────────────
function toggleRow(el) {
  el.classList.toggle('open');
}

// ─────────────────────────────────────────────
// STATUS CYCLE (on the circle button)
// ─────────────────────────────────────────────
function cycleStatus(e, subj, gName, rName) {
  e.stopPropagation();
  const store = loadStorage();
  const k = chapterKey(subj, gName, rName);
  const cur = store[k]?.status || 'todo';
  const next = cur === 'todo' ? 'wip' : cur === 'wip' ? 'done' : 'todo';
  store[k] = store[k] || {};
  store[k].status = next;
  saveStorage(store);
  render();
  updateProgressSummary();
}

// ─────────────────────────────────────────────
// SET STATUS from detail panel
// ─────────────────────────────────────────────
function setChapterStatus(subj, gName, rName, status) {
  const store = loadStorage();
  const k = chapterKey(subj, gName, rName);
  store[k] = store[k] || {};
  store[k].status = status;
  saveStorage(store);
  // update just the row classes without full re-render
  const rowEl = document.querySelector(`[data-key="${CSS.escape(k)}"]`);
  if(rowEl) {
    rowEl.classList.remove('status-done','status-wip');
    if(status === 'done') rowEl.classList.add('status-done');
    else if(status === 'wip') rowEl.classList.add('status-wip');
    // update circle btn
    const btn = rowEl.querySelector('.status-btn');
    if(btn) {
      btn.className = `status-btn ${status}`;
      btn.textContent = STATUS_ICONS[status];
    }
    // update detail buttons
    rowEl.querySelectorAll('.status-option').forEach(b => {
      b.className = 'status-option' + (b.dataset.s === status ? ` active-${status}` : '');
    });
  }
  updateProgressSummary();
}

// ─────────────────────────────────────────────
// SAVE NOTES & DATE
// ─────────────────────────────────────────────
let saveTimers = {};

function onNoteChange(key, value) {
  clearTimeout(saveTimers[key]);
  saveTimers[key] = setTimeout(() => {
    const store = loadStorage();
    store[key] = store[key] || {};
    store[key].notes = value;
    saveStorage(store);
    const ind = document.querySelector(`[data-key="${CSS.escape(key)}"] .save-indicator`);
    if(ind){ ind.classList.add('show'); setTimeout(()=>ind.classList.remove('show'), 1500); }
  }, 600);
}

function onDateChange(key, value) {
  const store = loadStorage();
  store[key] = store[key] || {};
  store[key].date = value;
  saveStorage(store);
  const ind = document.querySelector(`[data-key="${CSS.escape(key)}"] .save-indicator`);
  if(ind){ ind.classList.add('show'); setTimeout(()=>ind.classList.remove('show'), 1500); }
}

// ─────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────
function render() {
  const srch = (document.getElementById('srch')?.value || '').toLowerCase();
  const list = document.getElementById('list');
  const store = loadStorage();

  document.getElementById('subtabs').classList.toggle('visible', subject === 'chem');

  let html = '', total = 0, shown = 0;

  D[subject].forEach((g, gi) => {
    if(subject === 'chem' && subCat !== 'all' && g.sub !== subCat) return;
    let rowsHtml = '', rankInGroup = 0;

    g.rows.forEach((r, ri) => {
      total++;
      const k = chapterKey(subject, g.g, r.n);
      const saved = store[k] || {};
      const status = saved.status || 'todo';
      const notes = saved.notes || '';
      const date = saved.date || '';

      const matchFreq = freqF === 'all' || r.f === freqF;
      const matchDiff = diffF === 'all' || r.d === diffF;
      const matchSearch = !srch || r.n.toLowerCase().includes(srch);
      const matchStatus = statF === 'all' || status === statF;

      if(!matchFreq || !matchDiff || !matchSearch || !matchStatus) {
        rowsHtml += `<div class="row hidden"></div>`;
        return;
      }
      shown++;
      rankInGroup++;

      const delay = (gi * 0.03 + rankInGroup * 0.015).toFixed(2);
      const statusClass = status !== 'todo' ? `status-${status}` : '';
      const topicTags = (r.topics||[]).map(t=>`<span class="topic-tag">${t}</span>`).join('');

      rowsHtml += `
        <div class="row ${statusClass}" style="animation-delay:${delay}s" data-key="${k.replace(/"/g,'&quot;')}">
          <div class="row-header" onclick="toggleRow(this.closest('.row'))">
            <span class="num">${rankInGroup}</span>
            <button class="status-btn ${status}" title="Click to change status"
              onclick="cycleStatus(event,'${subject}','${g.g.replace(/'/g,"\\'")}','${r.n.replace(/'/g,"\\'")}')">
              ${STATUS_ICONS[status]}
            </button>
            <span class="name">${r.n}</span>
            <div class="bar-bg"><div class="bar-fill" style="width:${r.p}%;background:${fCol[r.f]}"></div></div>
            <div class="badges">
              <span class="badge ${fClass[r.f]}">${fLabel[r.f]}</span>
              <span class="badge ${dClass[r.d]}">${dLabel[r.d]}</span>
            </div>
            <span class="expand-icon">▾</span>
          </div>
          <div class="row-detail">
            <div class="detail-inner">
              <div class="detail-grid">
                <div class="detail-chip"><span class="detail-chip-label">Avg / Year</span><span class="detail-chip-val">${r.yr||'—'}</span></div>
                <div class="detail-chip"><span class="detail-chip-label">Heavier in</span><span class="detail-chip-val">${r.main||'—'}</span></div>
                <div class="detail-chip"><span class="detail-chip-label">Study Time</span><span class="detail-chip-val">${r.hrs||'—'}</span></div>
                <div class="detail-chip"><span class="detail-chip-label">Best Book</span><span class="detail-chip-val">${r.book||'—'}</span></div>
                <div class="detail-chip" style="grid-column:1/-1"><span class="detail-chip-label">Most tested concept</span><span class="detail-chip-val">${r.hot||'—'}</span></div>
              </div>

              <div class="detail-topics">
                <strong>Key topics</strong>
                <div class="topic-tags">${topicTags}</div>
              </div>

              <div>
                <div class="detail-label">Status</div>
                <div class="status-row">
                  <button class="status-option ${status==='todo'?'active-todo':''}" data-s="todo"
                    onclick="setChapterStatus('${subject}','${g.g.replace(/'/g,"\\'")}','${r.n.replace(/'/g,"\\'")}','todo')">○ Not Started</button>
                  <button class="status-option ${status==='wip'?'active-wip':''}" data-s="wip"
                    onclick="setChapterStatus('${subject}','${g.g.replace(/'/g,"\\'")}','${r.n.replace(/'/g,"\\'")}','wip')">⟳ In Progress</button>
                  <button class="status-option ${status==='done'?'active-done':''}" data-s="done"
                    onclick="setChapterStatus('${subject}','${g.g.replace(/'/g,"\\'")}','${r.n.replace(/'/g,"\\'")}','done')">✓ Done</button>
                </div>
              </div>

              <div>
                <div class="detail-label">Notes & Revision date</div>
                <div class="detail-notes-row">
                  <textarea class="notes-input" placeholder="Add your notes, weak areas, reminders…"
                    oninput="onNoteChange('${k.replace(/'/g,"\\'")}', this.value)">${notes}</textarea>
                  <div>
                    <div class="detail-label" style="margin-bottom:4px">Revision due</div>
                    <input type="date" class="date-input" value="${date}"
                      onchange="onDateChange('${k.replace(/'/g,"\\'")}', this.value)">
                    <div class="save-indicator">✓ saved</div>
                  </div>
                </div>
              </div>

            </div>
          </div>
        </div>`;
    });

    if(rowsHtml.replace(/<div class="row hidden"><\/div>/g,'').trim())
      html += `<div class="section-head">${g.g}</div>${rowsHtml}`;
  });

  document.getElementById('count').textContent = `Showing ${shown} of ${total} chapters`;
  list.innerHTML = html || `<div class="empty-state"><div class="empty-state-icon">🔍</div><p>No chapters match your filters.</p></div>`;
}

// ─────────────────────────────────────────────
// FILTER SETTERS
// ─────────────────────────────────────────────
function clearAllFilterBtns() {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('on'));
}

function setSubject(s, el) {
  subject = s; subCat = 'all';
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('.stab').forEach(t => { t.classList.remove('active'); if(t.textContent==='All') t.classList.add('active'); });
  render();
}

function setSub(s, el) {
  subCat = s;
  document.querySelectorAll('.stab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  render();
}

function setFreq(f, el) {
  freqF = freqF===f && f!=='all' ? 'all' : f;
  diffF = 'all'; statF = 'all';
  clearAllFilterBtns();
  if(freqF==='all') document.querySelector('.f-all').classList.add('on');
  else el.classList.add('on');
  render();
}

function setDiff(d, el) {
  diffF = diffF===d ? 'all' : d;
  freqF = 'all'; statF = 'all';
  clearAllFilterBtns();
  document.querySelector('.f-all').classList.add('on');
  if(diffF!=='all') el.classList.add('on');
  render();
}

function setStatus(s, el) {
  statF = statF===s ? 'all' : s;
  freqF = 'all'; diffF = 'all';
  clearAllFilterBtns();
  document.querySelector('.f-all').classList.add('on');
  if(statF!=='all') el.classList.add('on');
  render();
}

// ─────────────────────────────────────────────
// ANIMATED LEAVES
// ─────────────────────────────────────────────
const leafEmojis = ['🍃','🌿','🍂','🌱','🍀'];
function spawnLeaf() {
  const bg = document.querySelector('.bg');
  const leaf = document.createElement('div');
  leaf.className = 'leaf';
  leaf.textContent = leafEmojis[Math.floor(Math.random()*leafEmojis.length)];
  leaf.style.left = Math.random()*100 + 'vw';
  leaf.style.fontSize = (10 + Math.random()*10) + 'px';
  const dur = 12 + Math.random()*14;
  leaf.style.animationDuration = dur + 's';
  leaf.style.animationDelay = Math.random()*4 + 's';
  bg.appendChild(leaf);
  setTimeout(() => leaf.remove(), (dur+4)*1000);
}

// spawn leaves periodically
setInterval(spawnLeaf, 2200);
for(let i=0;i<5;i++) setTimeout(spawnLeaf, i*600);

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
render();
updateProgressSummary();
</script>
