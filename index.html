<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JEE Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;overflow-x:hidden}

/* ══ THEMES ══ */
[data-theme="forest"]{--bg:#0d1a12;--bg2:#112018;--bg3:#162a1e;--card:rgba(26,46,34,0.75);--card-s:#1a2e22;--brd:rgba(45,90,61,0.35);--brd2:rgba(45,90,61,0.2);--t:#e8f5ee;--t2:#9dc9b0;--t3:#5a8a6e;--acc:#4ade80;--acc2:#22c55e;--glow:rgba(74,222,128,0.2);--fh:#4ade80;--fm:#fbbf24;--fl:#6b7280;--de:#60a5fa;--dm:#e879f9;--dd:#f87171;--sa:0.0,0.12,0.08;--sb:0.18,0.7,0.4}
[data-theme="ocean"]{--bg:#060d1a;--bg2:#081222;--bg3:#0a1a2e;--card:rgba(13,32,64,0.75);--card-s:#0d2040;--brd:rgba(26,74,122,0.35);--brd2:rgba(26,74,122,0.2);--t:#e0f0ff;--t2:#7ab8e8;--t3:#3a7aaa;--acc:#38bdf8;--acc2:#0ea5e9;--glow:rgba(56,189,248,0.2);--fh:#38bdf8;--fm:#fbbf24;--fl:#6b7280;--de:#a78bfa;--dm:#f472b6;--dd:#f87171;--sa:0.0,0.04,0.12;--sb:0.1,0.5,0.8}
[data-theme="space"]{--bg:#05050f;--bg2:#080818;--bg3:#0a0a20;--card:rgba(16,16,58,0.75);--card-s:#10103a;--brd:rgba(42,42,106,0.35);--brd2:rgba(42,42,106,0.2);--t:#e8e8ff;--t2:#9090c8;--t3:#5050a0;--acc:#a78bfa;--acc2:#8b5cf6;--glow:rgba(167,139,250,0.2);--fh:#a78bfa;--fm:#fbbf24;--fl:#6b7280;--de:#60a5fa;--dm:#f472b6;--dd:#f87171;--sa:0.02,0.02,0.08;--sb:0.5,0.3,0.9}
[data-theme="ember"]{--bg:#120800;--bg2:#1a0d00;--bg3:#221200;--card:rgba(42,18,0,0.75);--card-s:#2a1200;--brd:rgba(106,40,0,0.35);--brd2:rgba(106,40,0,0.2);--t:#fff0e0;--t2:#d4935a;--t3:#8a5020;--acc:#fb923c;--acc2:#f97316;--glow:rgba(251,146,60,0.2);--fh:#fb923c;--fm:#fbbf24;--fl:#6b7280;--de:#60a5fa;--dm:#e879f9;--dd:#f87171;--sa:0.1,0.03,0.0;--sb:0.9,0.3,0.05}
[data-theme="sakura"]{--bg:#180810;--bg2:#200d18;--bg3:#2a1020;--card:rgba(42,16,32,0.75);--card-s:#2a1020;--brd:rgba(122,42,80,0.35);--brd2:rgba(122,42,80,0.2);--t:#ffe8f0;--t2:#d490b0;--t3:#8a4060;--acc:#f472b6;--acc2:#ec4899;--glow:rgba(244,114,182,0.2);--fh:#f472b6;--fm:#fbbf24;--fl:#6b7280;--de:#60a5fa;--dm:#c084fc;--dd:#f87171;--sa:0.1,0.03,0.07;--sb:0.9,0.2,0.5}

body{font-family:'Plus Jakarta Sans',-apple-system,sans-serif;background:var(--bg);color:var(--t);min-height:100vh}

/* ── SHADER BG ── */
#bgc{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.noise-ov{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0.025;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}

/* ── LAYOUT ── */
.shell{position:relative;z-index:2;display:flex;flex-direction:column;min-height:100vh}

/* ── NAVBAR ── */
nav{
  position:sticky;top:0;z-index:100;height:54px;
  display:flex;align-items:center;padding:0 16px;gap:8px;
  background:rgba(0,0,0,0.5);border-bottom:1px solid rgba(255,255,255,0.06);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
}
.logo{font-weight:700;font-size:0.95rem;color:var(--acc);letter-spacing:-0.02em;margin-right:auto;display:flex;align-items:center;gap:7px}
.logo-dot{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow);animation:blink 2.5s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.4}}
.nav-tabs{display:flex;gap:2px}
.ntab{padding:7px 16px;border:none;background:transparent;color:var(--t3);font-family:inherit;font-size:0.8rem;font-weight:500;cursor:pointer;border-radius:8px;transition:all 0.2s;display:flex;align-items:center;gap:5px}
.ntab:hover{color:var(--t2);background:rgba(255,255,255,0.06)}
.ntab.on{color:var(--acc);background:var(--glow)}
.tpicker{display:flex;gap:4px;margin-left:8px;align-items:center}
.tdot{display:flex;align-items:center;gap:5px;padding:4px 10px 4px 6px;border-radius:20px;cursor:pointer;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);transition:all 0.2s;font-size:0.7rem;color:rgba(255,255,255,0.4);font-family:inherit;white-space:nowrap}
.tdot:hover{background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.7);border-color:rgba(255,255,255,0.15)}
.tdot.on{background:rgba(255,255,255,0.12);color:rgba(255,255,255,0.95);border-color:rgba(255,255,255,0.25);font-weight:600}
.tdot-swatch{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.tdot[data-t="forest"] .tdot-swatch{background:linear-gradient(135deg,#22c55e,#166534)}
.tdot[data-t="ocean"] .tdot-swatch{background:linear-gradient(135deg,#38bdf8,#1e40af)}
.tdot[data-t="space"] .tdot-swatch{background:linear-gradient(135deg,#a78bfa,#312e81)}
.tdot[data-t="ember"] .tdot-swatch{background:linear-gradient(135deg,#fb923c,#7c2d12)}
.tdot[data-t="sakura"] .tdot-swatch{background:linear-gradient(135deg,#f472b6,#831843)}
@media(max-width:700px){.tdot span{display:none}.tdot{padding:5px 6px}.tdot-swatch{width:14px;height:14px}}

/* ── PAGES ── */
.page{flex:1;padding:28px 16px 80px;overflow-y:auto}
.inner{max-width:960px;margin:0 auto}

/* ── GLASS ── */
.glass{background:var(--card);border:1px solid rgba(255,255,255,0.06);border-radius:16px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 8px 40px rgba(0,0,0,0.5),inset 0 1px 0 rgba(255,255,255,0.07)}

/* ══════════ TIMER PAGE ══════════ */
.timer-grid{display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:start;}
@media(max-width:760px){.timer-grid{grid-template-columns:1fr}}

.tcenter{padding:44px 40px;text-align:center}
@media(max-width:480px){.tcenter{padding:24px 14px}}

/* Subject pills */
.spills{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-bottom:24px}
.spill{padding:5px 15px;border-radius:20px;border:1px solid rgba(255,255,255,0.08);background:transparent;color:var(--t2);font-family:inherit;font-size:0.75rem;cursor:pointer;transition:all 0.2s}
.spill:hover,.spill.on{border-color:var(--acc);color:var(--acc);background:var(--glow)}
.spill.on{font-weight:600}

/* Mode tabs */
.mtabs{display:flex;gap:0;background:rgba(0,0,0,0.3);border-radius:10px;padding:3px;width:fit-content;margin:0 auto 28px}
.mtab{padding:7px 18px;border:none;background:transparent;color:var(--t3);font-family:inherit;font-size:0.76rem;cursor:pointer;border-radius:7px;transition:all 0.2s;font-weight:500}
.mtab.on{background:var(--acc);color:#000;font-weight:700}

/* Ring */
.ring-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center;margin-bottom:24px}
.rsvg{transform:rotate(-90deg)}
.rbg{fill:none;stroke:rgba(255,255,255,0.08);stroke-width:7}
.rprog{fill:none;stroke:var(--acc);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset 0.6s ease;filter:drop-shadow(0 0 8px var(--acc)) drop-shadow(0 0 20px rgba(0,0,0,0.5))}
.rinner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.tdisp{font-family:'JetBrains Mono',monospace;font-size:clamp(2.2rem,7vw,3.4rem);font-weight:600;color:var(--t);letter-spacing:-0.02em;line-height:1}
.tlbl{font-size:0.72rem;color:var(--t3);margin-top:6px;letter-spacing:0.08em;text-transform:uppercase}

/* Controls */
.ctrls{display:flex;gap:10px;justify-content:center;margin-bottom:20px;flex-wrap:wrap}
.cbtn{padding:11px 24px;border-radius:12px;border:none;font-family:inherit;font-size:0.85rem;font-weight:600;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:7px}
.cbtn.pri{background:var(--acc);color:#000}
.cbtn.pri:hover{filter:brightness(1.12);transform:translateY(-1px)}
.cbtn.sec{background:rgba(255,255,255,0.06);color:var(--t2);border:1px solid rgba(255,255,255,0.1)}
.cbtn.sec:hover{border-color:var(--acc);color:var(--acc)}
.cbtn.dan{background:rgba(248,113,113,0.12);color:#f87171;border:1px solid rgba(248,113,113,0.28)}
.cbtn.dan:hover{background:rgba(248,113,113,0.22)}

.note-in{width:100%;padding:9px 12px;border-radius:10px;border:1px solid rgba(255,255,255,0.08);background:rgba(0,0,0,0.3);color:var(--t);font-family:inherit;font-size:0.82rem;outline:none;resize:none;transition:border-color 0.2s}
.note-in:focus{border-color:var(--acc)}
.note-in::placeholder{color:var(--t3)}

/* Break chips */
.bchips{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.bchip{padding:5px 13px;border-radius:20px;border:1px solid rgba(255,255,255,0.08);background:transparent;color:var(--t3);font-size:0.72rem;cursor:pointer;font-family:'JetBrains Mono',monospace;transition:all 0.2s}
.bchip:hover,.bchip.on{border-color:var(--acc);color:var(--acc);background:var(--glow)}
.bchip.on{font-weight:600}

/* Stats */
.scard{padding:22px}
.stitle{font-size:0.66rem;font-weight:700;color:var(--t3);letter-spacing:0.09em;text-transform:uppercase;margin-bottom:14px}
.srow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid rgba(255,255,255,0.05)}
.srow:last-child{border-bottom:none}
.slabel{font-size:0.78rem;color:var(--t2)}
.sval{font-family:'JetBrains Mono',monospace;font-size:0.85rem;color:var(--acc);font-weight:600}

/* Heatmap */
.hmap{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.hday{width:30px;height:30px;border-radius:6px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:0.52rem;color:var(--t3);gap:1px;cursor:default;transition:all 0.2s}
.hday.h1{background:rgba(74,222,128,0.15);border-color:var(--acc)}
.hday.h2{background:rgba(74,222,128,0.3);border-color:var(--acc)}
.hday.h3{background:rgba(74,222,128,0.5);border-color:var(--acc)}
.hday.h4{background:var(--acc);border-color:var(--acc);color:#000}
[data-theme="ocean"] .hday.h1{background:rgba(56,189,248,0.15)}
[data-theme="ocean"] .hday.h2{background:rgba(56,189,248,0.3)}
[data-theme="ocean"] .hday.h3{background:rgba(56,189,248,0.5)}
[data-theme="ocean"] .hday.h4{background:var(--acc);color:#000}
[data-theme="space"] .hday.h1{background:rgba(167,139,250,0.15)}
[data-theme="space"] .hday.h2{background:rgba(167,139,250,0.3)}
[data-theme="space"] .hday.h3{background:rgba(167,139,250,0.5)}
[data-theme="ember"] .hday.h1{background:rgba(251,146,60,0.15)}
[data-theme="ember"] .hday.h2{background:rgba(251,146,60,0.3)}
[data-theme="ember"] .hday.h3{background:rgba(251,146,60,0.5)}
[data-theme="sakura"] .hday.h1{background:rgba(244,114,182,0.15)}
[data-theme="sakura"] .hday.h2{background:rgba(244,114,182,0.3)}
[data-theme="sakura"] .hday.h3{background:rgba(244,114,182,0.5)}

/* History */
.hist-card{padding:22px;margin-top:16px}
.hist-empty{text-align:center;padding:28px;color:var(--t3);font-size:0.82rem}
.sess{padding:11px 13px;border-radius:10px;background:rgba(0,0,0,0.25);border:1px solid rgba(255,255,255,0.05);margin-bottom:7px;display:flex;align-items:center;gap:10px}
.sdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.sinfo{flex:1;min-width:0}
.smain{font-size:0.8rem;color:var(--t);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ssub{font-size:0.68rem;color:var(--t3);margin-top:2px}
.sdur{font-family:'JetBrains Mono',monospace;font-size:0.82rem;color:var(--acc);font-weight:600;flex-shrink:0}
.sdel{background:none;border:none;color:var(--t3);cursor:pointer;font-size:13px;padding:4px;border-radius:6px;transition:all 0.2s;flex-shrink:0}
.sdel:hover{color:#f87171;background:rgba(248,113,113,0.1)}

/* ══════════ CHAPTER PAGE ══════════ */
.ch-header-section{text-align:center;margin-bottom:28px}
.badge-pill{display:inline-flex;align-items:center;gap:6px;font-size:0.68rem;font-family:'JetBrains Mono',monospace;color:var(--acc);background:var(--glow);border:1px solid rgba(255,255,255,0.08);padding:4px 12px;border-radius:20px;margin-bottom:12px;letter-spacing:0.04em}
.ch-header-section h1{font-size:clamp(1.5rem,4vw,2.1rem);font-weight:700;color:var(--t);letter-spacing:-0.025em;margin-bottom:7px}
.ch-header-section p{color:var(--t2);font-size:0.88rem}

.prog-chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.pchip{display:flex;align-items:center;gap:5px;font-size:0.72rem;padding:4px 12px;border-radius:20px;border:1px solid rgba(255,255,255,0.07);background:rgba(0,0,0,0.3);color:var(--t2);font-family:'JetBrains Mono',monospace}
.pdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.pdot.done{background:var(--fh)}.pdot.wip{background:var(--fm)}.pdot.todo{background:rgba(255,255,255,0.15)}
.ov-bar{height:3px;border-radius:2px;background:rgba(255,255,255,0.08);overflow:hidden;max-width:400px;margin:10px auto 0}
.ov-fill{height:100%;border-radius:2px;background:var(--acc);transition:width 0.7s ease}

/* Subject tabs */
.stabs-wrap{display:flex;justify-content:center;margin-bottom:14px}
.stabs{display:flex;gap:4px;padding:5px;background:rgba(0,0,0,0.35);border:1px solid rgba(255,255,255,0.07);border-radius:14px}
.stab{padding:8px 20px;border:none;background:transparent;color:var(--t3);font-family:inherit;font-size:0.82rem;font-weight:500;cursor:pointer;border-radius:10px;transition:all 0.2s;display:flex;align-items:center;gap:5px}
.stab:hover{color:var(--t2);background:rgba(255,255,255,0.06)}
.stab.on{background:var(--acc);color:#000;font-weight:700}
@media(max-width:480px){.stab{padding:7px 12px;font-size:0.75rem}.stab .ticon{display:none}}

/* Chem subtabs */
.chemtabs{display:flex;justify-content:center;margin-bottom:12px}
.chem-inner{display:flex;gap:3px;padding:4px;background:rgba(0,0,0,0.3);border-radius:10px}
.ctab{padding:5px 13px;border:none;background:transparent;color:var(--t3);font-size:0.75rem;cursor:pointer;border-radius:7px;transition:all 0.2s;font-family:inherit}
.ctab:hover{color:var(--t2)}
.ctab.on{background:rgba(255,255,255,0.1);color:var(--t);font-weight:500}

/* Filters */
.fwrap{padding:13px 16px;margin-bottom:18px;display:flex;flex-direction:column;gap:10px;align-items:center;background:rgba(0,0,0,0.25);border:1px solid rgba(255,255,255,0.06);border-radius:14px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.frow{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;align-items:center}
.fsep{width:1px;height:16px;background:rgba(255,255,255,0.08);margin:0 3px}
.fb{padding:5px 12px;border-radius:20px;border:1px solid rgba(255,255,255,0.07);background:transparent;color:var(--t3);font-size:0.7rem;cursor:pointer;font-family:inherit;transition:all 0.2s}
.fb:hover{border-color:rgba(255,255,255,0.14);color:var(--t2)}
.fb.on{border-color:transparent;font-weight:600}
.fb.fa.on{background:rgba(255,255,255,0.1);color:var(--t)}
.fb.fh.on{background:var(--glow);color:var(--fh);border-color:var(--acc)}
.fb.fm.on{background:rgba(251,191,36,0.12);color:var(--fm);border-color:rgba(251,191,36,0.4)}
.fb.fl.on{background:rgba(107,114,128,0.15);color:var(--fl);border-color:rgba(107,114,128,0.3)}
.fb.de.on{background:rgba(96,165,250,0.12);color:var(--de);border-color:rgba(96,165,250,0.3)}
.fb.dm.on{background:rgba(232,121,249,0.12);color:var(--dm);border-color:rgba(232,121,249,0.3)}
.fb.dd.on{background:rgba(248,113,113,0.12);color:var(--dd);border-color:rgba(248,113,113,0.3)}
.fb.sd.on{background:var(--glow);color:var(--fh);border-color:var(--acc)}
.fb.sw.on{background:rgba(251,191,36,0.12);color:var(--fm);border-color:rgba(251,191,36,0.4)}
.fb.st.on{background:rgba(107,114,128,0.15);color:var(--fl);border-color:rgba(107,114,128,0.3)}

.srch-w{position:relative;width:100%;max-width:300px}
.srch-i{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--t3);font-size:0.75rem;pointer-events:none}
.srch{width:100%;padding:7px 13px 7px 32px;border-radius:20px;border:1px solid rgba(255,255,255,0.08);background:rgba(0,0,0,0.3);color:var(--t);font-family:inherit;font-size:0.78rem;outline:none;transition:border-color 0.2s}
.srch:focus{border-color:var(--acc)}
.srch::placeholder{color:var(--t3)}

.ch-count{text-align:center;font-size:0.72rem;color:var(--t3);font-family:'JetBrains Mono',monospace;margin-bottom:14px}

/* Section head */
.shead{font-size:0.65rem;font-weight:700;color:var(--t3);letter-spacing:0.08em;text-transform:uppercase;margin:18px 0 7px;display:flex;align-items:center;gap:8px}
.shead::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.06)}

/* Chapter row */
.crow{background:rgba(0,0,0,0.28);border:1px solid rgba(255,255,255,0.05);border-radius:12px;margin-bottom:5px;overflow:hidden;transition:border-color 0.2s,box-shadow 0.2s;animation:fu 0.3s ease both}
@keyframes fu{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.crow:hover{border-color:rgba(255,255,255,0.12);box-shadow:0 4px 24px rgba(0,0,0,0.4)}
.crow.sd{border-left:3px solid var(--fh);border-color:rgba(255,255,255,0.05)}.crow.sw{border-left:3px solid var(--fm);border-color:rgba(255,255,255,0.05)}

.ch-hdr{display:flex;align-items:center;gap:9px;padding:10px 13px;cursor:pointer;transition:background 0.15s;user-select:none}
.ch-hdr:hover{background:rgba(255,255,255,0.04)}
.chnum{font-family:'JetBrains Mono',monospace;font-size:0.62rem;color:var(--t3);min-width:18px;text-align:right;flex-shrink:0}
.stbtn{width:20px;height:20px;border-radius:50%;border:1.5px solid rgba(255,255,255,0.15);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:9px;flex-shrink:0;transition:all 0.18s;padding:0;color:transparent}
.stbtn:hover{border-color:var(--acc)}
.stbtn.done{background:var(--fh);border-color:var(--fh);color:#000}
.stbtn.wip{background:var(--fm);border-color:var(--fm);color:#000}
.cname{flex:1;font-size:0.83rem;color:var(--t);font-weight:500;line-height:1.3}

<script>
// ════════════════════════════════
// PERFORMANCE MONITOR + MODE
// ════════════════════════════════
let perfMode = localStorage.getItem('jee_perf') === 'low';
let fpsSamples = [], fpsWarnShown = false, lastFpsTime = performance.now(), fpsFrames = 0;

function trackFPS(now) {
  fpsFrames++;
  if (now - lastFpsTime >= 2000) {
    const fps = fpsFrames / ((now - lastFpsTime) / 1000);
    fpsSamples.push(fps);
    fpsFrames = 0; lastFpsTime = now;
    if (fpsSamples.length >= 3 && !fpsWarnShown && !perfMode) {
      const avg = fpsSamples.reduce((a,b)=>a+b,0)/fpsSamples.length;
      if (avg < 20) { fpsWarnShown = true; showPerfPopup(Math.round(avg)); }
    }
    if (fpsSamples.length > 6) fpsSamples.shift();
  }
}

function showPerfPopup(fps) {
  const el = document.createElement('div');
  el.id = 'perf-popup';
  el.innerHTML = `
    <div style="position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px">
      <div style="background:#1a1a2e;border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:32px 28px;max-width:360px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.6)">
        <div style="font-size:2rem;margin-bottom:12px">⚡</div>
        <div style="font-size:1.05rem;font-weight:700;color:#fff;margin-bottom:8px">Low Performance Detected</div>
        <div style="font-size:0.82rem;color:#8888aa;margin-bottom:24px;line-height:1.6">Running at ~${fps} FPS. Enable Performance Mode for smoother scrolling (static background instead of animated).</div>
        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
          <button onclick="enablePerfMode()" style="padding:10px 22px;background:#a78bfa;border:none;border-radius:10px;color:#000;font-family:inherit;font-weight:700;font-size:0.85rem;cursor:pointer">Enable Performance Mode</button>
          <button onclick="dismissPerfPopup()" style="padding:10px 22px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#ccc;font-family:inherit;font-size:0.85rem;cursor:pointer">Keep Animations</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(el);
}

function enablePerfMode() {
  perfMode = true; localStorage.setItem('jee_perf','low');
  dismissPerfPopup(); applyPerfMode(); toast('⚡ Performance mode on');
  const pb = document.getElementById('perfBtn');
  if(pb) pb.style.color = '#a78bfa';
}
function dismissPerfPopup() { const e=document.getElementById('perf-popup'); if(e) e.remove(); }
function togglePerfMode() {
  if (perfMode) {
    perfMode = false; localStorage.setItem('jee_perf','high');
    applyPerfMode(); toast('✨ Animations enabled');
    const pb = document.getElementById('perfBtn'); if(pb) pb.style.color = 'rgba(255,255,255,0.5)';
  } else { enablePerfMode(); }
}
function applyPerfMode() {
  const bgc = document.getElementById('bgc');
  if (perfMode) {
    bgc.style.display = 'none';
    document.body.style.background = STATIC_BG[curTheme] || STATIC_BG.forest;
  } else {
    bgc.style.display = '';
    document.body.style.background = '';
    startAnimation(curTheme);
  }
}

const STATIC_BG = {
  forest: 'radial-gradient(ellipse at 20% 50%, #1a3a22 0%, #0d1a12 60%)',
  ocean:  'radial-gradient(ellipse at 80% 30%, #0a2040 0%, #060d1a 60%)',
  space:  'radial-gradient(ellipse at 50% 50%, #12123a 0%, #05050f 60%)',
  ember:  'radial-gradient(ellipse at 30% 70%, #3a1400 0%, #120800 60%)',
  sakura: 'radial-gradient(ellipse at 60% 40%, #3a1030 0%, #180810 60%)',
};

// ════════════════════════════════
// CANVAS 2D BACKGROUND ANIMATIONS
// ════════════════════════════════
const bgc = document.getElementById('bgc');
const ctx = bgc.getContext('2d');
let animFrame = null, curAnimTheme = null;

// Theme base colors for gradient bg
const THEME_BG = {
  forest: ['#0a1810', '#112018', '#0d1a12'],
  ocean:  ['#040c18', '#081222', '#060d1a'],
  space:  ['#030308', '#080818', '#05050f'],
  ember:  ['#100500', '#1a0d00', '#120800'],
  sakura: ['#140610', '#200d18', '#180810'],
};

function resizeBgc() {
  bgc.width  = window.innerWidth;
  bgc.height = window.innerHeight;
}
window.addEventListener('resize', () => { resizeBgc(); });
resizeBgc();

// ── FOREST: dust motes floating in shafts of light ──
function animForest() {
  const W = bgc.width, H = bgc.height;
  const particles = Array.from({length:120}, () => ({
    x: Math.random()*W, y: Math.random()*H,
    r: 0.5 + Math.random()*2.5,
    vx: (Math.random()-0.5)*0.18,
    vy: -0.08 - Math.random()*0.18,
    a: 0.1 + Math.random()*0.5,
    wa: Math.random()*Math.PI*2,
    ws: 0.003 + Math.random()*0.008,
  }));

  function draw(now) {
    animFrame = requestAnimationFrame(draw);
    trackFPS(now);
    if(perfMode) return;

    ctx.clearRect(0,0,W,H);

    // Deep gradient bg
    const grd = ctx.createLinearGradient(0,0,W*0.4,H);
    grd.addColorStop(0,'#0e2016'); grd.addColorStop(0.5,'#0d1a12'); grd.addColorStop(1,'#091510');
    ctx.fillStyle = grd; ctx.fillRect(0,0,W,H);

    // Subtle light shaft from top-left
    const shaft = ctx.createRadialGradient(W*0.15, 0, 0, W*0.15, 0, H*0.9);
    shaft.addColorStop(0,'rgba(80,200,120,0.07)');
    shaft.addColorStop(0.5,'rgba(40,120,70,0.04)');
    shaft.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle = shaft; ctx.fillRect(0,0,W,H);

    // Second shaft
    const shaft2 = ctx.createRadialGradient(W*0.7, H*0.1, 0, W*0.7, H*0.1, H*0.7);
    shaft2.addColorStop(0,'rgba(60,180,90,0.05)');
    shaft2.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle = shaft2; ctx.fillRect(0,0,W,H);

    // Dust motes
    particles.forEach(p => {
      p.wa += p.ws;
      p.x += p.vx + Math.sin(p.wa)*0.3;
      p.y += p.vy;
      if (p.y < -10) { p.y = H+10; p.x = Math.random()*W; }
      if (p.x < -10) p.x = W+10;
      if (p.x > W+10) p.x = -10;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(150,255,170,${p.a * (0.6 + 0.4*Math.sin(p.wa*1.3))})`;
      ctx.fill();
    });
  }
  draw(performance.now());
}

// ── OCEAN: calm sine waves layered ──
function animOcean() {
  const W = bgc.width, H = bgc.height;
  let t = 0;

  function draw(now) {
    animFrame = requestAnimationFrame(draw);
    trackFPS(now);
    if(perfMode) return;
    t += 0.006;
    ctx.clearRect(0,0,W,H);

    // Background
    const grd = ctx.createLinearGradient(0,0,0,H);
    grd.addColorStop(0,'#040c18'); grd.addColorStop(0.6,'#06122a'); grd.addColorStop(1,'#030a14');
    ctx.fillStyle = grd; ctx.fillRect(0,0,W,H);

    // Subtle radial glow
    const gl2 = ctx.createRadialGradient(W*0.5, H*0.3, 0, W*0.5, H*0.3, W*0.6);
    gl2.addColorStop(0,'rgba(20,100,180,0.12)');
    gl2.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle = gl2; ctx.fillRect(0,0,W,H);

    // Wave layers
    const waves = [
      {amp:28, freq:0.008, speed:1.0,   y:H*0.55, color:'rgba(10,80,160,0.18)',   lw:2},
      {amp:18, freq:0.012, speed:1.4,   y:H*0.62, color:'rgba(15,100,200,0.14)',  lw:1.5},
      {amp:35, freq:0.006, speed:0.7,   y:H*0.70, color:'rgba(20,120,220,0.12)',  lw:2.5},
      {amp:12, freq:0.018, speed:2.0,   y:H*0.78, color:'rgba(30,150,240,0.1)',   lw:1},
      {amp:40, freq:0.005, speed:0.5,   y:H*0.85, color:'rgba(8,60,140,0.2)',     lw:3},
    ];

    waves.forEach(w => {
      ctx.beginPath();
      ctx.moveTo(0, w.y);
      for(let x=0; x<=W; x+=4) {
        const y = w.y + Math.sin(x*w.freq + t*w.speed)*w.amp
                      + Math.sin(x*w.freq*1.7 + t*w.speed*0.6)*w.amp*0.4;
        ctx.lineTo(x, y);
      }
      ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath();
      ctx.fillStyle = w.color; ctx.fill();
      ctx.strokeStyle = w.color.replace(/[\d.]+\)$/, '0.5)');
      ctx.lineWidth = w.lw; ctx.stroke();
    });

    // Bioluminescent dots
    for(let i=0; i<8; i++) {
      const px = (W*0.1 + W*0.8*(i/8) + Math.sin(t*0.5+i)*30);
      const py = H*0.6 + Math.sin(t*0.8+i*1.3)*40;
      const gr = ctx.createRadialGradient(px,py,0,px,py,18);
      gr.addColorStop(0,'rgba(60,220,255,0.22)');
      gr.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle = gr; ctx.fillRect(px-18,py-18,36,36);
    }
  }
  draw(performance.now());
}

// ── SPACE: slow drifting stars + subtle nebula glow ──
function animSpace() {
  const W = bgc.width, H = bgc.height;
  // Stars at 3 depths
  const stars = Array.from({length:200}, () => ({
    x: Math.random()*W, y: Math.random()*H,
    r: 0.3 + Math.random()*1.8,
    a: 0.3 + Math.random()*0.7,
    tw: Math.random()*Math.PI*2,
    tws: 0.005 + Math.random()*0.02,
    vx: (Math.random()-0.5)*0.04,
    vy: (Math.random()-0.5)*0.02,
  }));
  let t = 0;

  function draw(now) {
    animFrame = requestAnimationFrame(draw);
    trackFPS(now);
    if(perfMode) return;
    t += 0.004;
    ctx.clearRect(0,0,W,H);

    // Deep space bg
    ctx.fillStyle = '#04040e'; ctx.fillRect(0,0,W,H);

    // Nebula glow 1
    const nb1 = ctx.createRadialGradient(W*0.3, H*0.4, 0, W*0.3, H*0.4, W*0.45);
    nb1.addColorStop(0,'rgba(80,30,160,0.14)');
    nb1.addColorStop(0.5,'rgba(40,10,100,0.07)');
    nb1.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle = nb1; ctx.fillRect(0,0,W,H);

    // Nebula glow 2
    const nb2 = ctx.createRadialGradient(W*0.75, H*0.6, 0, W*0.75, H*0.6, W*0.35);
    nb2.addColorStop(0,'rgba(20,60,160,0.1)');
    nb2.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle = nb2; ctx.fillRect(0,0,W,H);

    // Nebula glow 3 (breathing)
    const pulse = 0.06 + 0.03*Math.sin(t*0.5);
    const nb3 = ctx.createRadialGradient(W*0.5, H*0.25, 0, W*0.5, H*0.25, W*0.3);
    nb3.addColorStop(0,`rgba(120,50,200,${pulse})`);
    nb3.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle = nb3; ctx.fillRect(0,0,W,H);

    // Stars
    stars.forEach(s => {
      s.tw += s.tws;
      s.x += s.vx; s.y += s.vy;
      if(s.x < 0) s.x = W; if(s.x > W) s.x = 0;
      if(s.y < 0) s.y = H; if(s.y > H) s.y = 0;
      const a = s.a * (0.5 + 0.5*Math.sin(s.tw));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(210,210,255,${a})`;
      ctx.fill();
    });
  }
  draw(performance.now());
}

// ── EMBER: slow rising warm light orbs like candle glow ──
function animEmber() {
  const W = bgc.width, H = bgc.height;
  const orbs = Array.from({length:18}, () => ({
    x: Math.random()*W,
    y: H*0.5 + Math.random()*H*0.5,
    r: 40 + Math.random()*80,
    vy: -(0.2 + Math.random()*0.5),
    a: 0.04 + Math.random()*0.09,
    wa: Math.random()*Math.PI*2,
    ws: 0.004 + Math.random()*0.008,
    hue: 15 + Math.random()*25, // orange-red
  }));
  // Small sparks
  const sparks = Array.from({length:40}, () => ({
    x: Math.random()*W, y: H + Math.random()*100,
    vx: (Math.random()-0.5)*0.5,
    vy: -(0.4 + Math.random()*1.2),
    a: 0.4 + Math.random()*0.6,
    life: Math.random(),
    r: 0.5 + Math.random()*1.5,
  }));

  function draw(now) {
    animFrame = requestAnimationFrame(draw);
    trackFPS(now);
    if(perfMode) return;
    ctx.clearRect(0,0,W,H);

    // Dark warm bg
    const grd = ctx.createLinearGradient(0,0,0,H);
    grd.addColorStop(0,'#0e0500'); grd.addColorStop(0.6,'#180800'); grd.addColorStop(1,'#100400');
    ctx.fillStyle = grd; ctx.fillRect(0,0,W,H);

    // Base warm glow on horizon
    const horiz = ctx.createRadialGradient(W*0.5, H*0.9, 0, W*0.5, H*0.9, W*0.7);
    horiz.addColorStop(0,'rgba(200,60,10,0.18)');
    horiz.addColorStop(0.5,'rgba(150,30,5,0.08)');
    horiz.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle = horiz; ctx.fillRect(0,0,W,H);

    // Rising orbs (heat shimmer / candle glow)
    orbs.forEach(o => {
      o.wa += o.ws;
      o.x += Math.sin(o.wa)*0.6;
      o.y += o.vy;
      if(o.y < -o.r*2) { o.y = H + o.r; o.x = Math.random()*W; }
      const gr = ctx.createRadialGradient(o.x,o.y,0,o.x,o.y,o.r);
      gr.addColorStop(0,`hsla(${o.hue},100%,60%,${o.a})`);
      gr.addColorStop(0.5,`hsla(${o.hue+10},90%,40%,${o.a*0.4})`);
      gr.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle = gr; ctx.fillRect(o.x-o.r,o.y-o.r,o.r*2,o.r*2);
    });

    // Sparks
    sparks.forEach(s => {
      s.x += s.vx; s.y += s.vy; s.life -= 0.004;
      if(s.life <= 0) { s.life = 0.5+Math.random()*0.5; s.y = H+10; s.x = Math.random()*W; }
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(255,${120+Math.floor(s.life*100)},30,${s.a*s.life})`;
      ctx.fill();
    });
  }
  draw(performance.now());
}

// ── SAKURA: petals drifting down gently ──
function animSakura() {
  const W = bgc.width, H = bgc.height;
  const petals = Array.from({length:55}, () => ({
    x: Math.random()*W,
    y: Math.random()*H,
    r: 3 + Math.random()*5,
    vx: (Math.random()-0.5)*0.4,
    vy: 0.3 + Math.random()*0.7,
    rot: Math.random()*Math.PI*2,
    rots: (Math.random()-0.5)*0.02,
    wa: Math.random()*Math.PI*2,
    ws: 0.01 + Math.random()*0.02,
    a: 0.15 + Math.random()*0.5,
    hue: 330 + Math.random()*30,
  }));

  function draw(now) {
    animFrame = requestAnimationFrame(draw);
    trackFPS(now);
    if(perfMode) return;
    ctx.clearRect(0,0,W,H);

    // Deep plum bg
    const grd = ctx.createLinearGradient(0,0,W*0.5,H);
    grd.addColorStop(0,'#160610'); grd.addColorStop(0.5,'#200d18'); grd.addColorStop(1,'#180810');
    ctx.fillStyle = grd; ctx.fillRect(0,0,W,H);

    // Soft aurora ribbons
    for(let i=0;i<3;i++) {
      const y = H*(0.2+i*0.25);
      const glow = ctx.createLinearGradient(0, y-60, 0, y+60);
      glow.addColorStop(0,'rgba(0,0,0,0)');
      glow.addColorStop(0.5,`rgba(${180+i*20},40,${100+i*30},0.06)`);
      glow.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle = glow; ctx.fillRect(0, y-60, W, 120);
    }

    // Subtle radial glow
    const rg = ctx.createRadialGradient(W*0.6, H*0.3, 0, W*0.6, H*0.3, W*0.5);
    rg.addColorStop(0,'rgba(200,80,140,0.08)');
    rg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle = rg; ctx.fillRect(0,0,W,H);

    // Petals
    petals.forEach(p => {
      p.wa += p.ws;
      p.rot += p.rots;
      p.x += p.vx + Math.sin(p.wa)*0.5;
      p.y += p.vy;
      if(p.y > H+20) { p.y = -20; p.x = Math.random()*W; }
      if(p.x < -20) p.x = W+20; if(p.x > W+20) p.x = -20;

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      // Draw petal shape (ellipse)
      ctx.beginPath();
      ctx.ellipse(0, 0, p.r, p.r*0.55, 0, 0, Math.PI*2);
      ctx.fillStyle = `hsla(${p.hue},70%,75%,${p.a})`;
      ctx.fill();
      ctx.restore();
    });
  }
  draw(performance.now());
}

const MODES={focus:{lbl:'Focus Session',def:25},break:{lbl:'Short Break',def:5},long:{lbl:'Long Break',def:15}};
const BREAKS=[15,20,25,30,45,60];
const SUBJS=['Physics','Chemistry','Mathematics','All Subjects'];
const CIRC=2*Math.PI*108; // ring circumference

let TM={mode:'focus',subj:'All Subjects',dur:25,running:false,elapsed:0,interval:null,sessStart:null};

const LS_S='jee_sessions_v2';
function loadSess(){try{return JSON.parse(localStorage.getItem(LS_S))||[];}catch{return[];}}
function saveSess(s){try{localStorage.setItem(LS_S,JSON.stringify(s));}catch{}}

function fmt(s){return`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function fmtm(s){if(s<60)return s+'m';return Math.floor(s/60)+'h '+(s%60)+'m';}

function updateRing(){
  const rem=Math.max(0,TM.dur*60-TM.elapsed);
  const pct=rem/(TM.dur*60);
  document.getElementById('rp').style.strokeDashoffset=CIRC*(1-pct);
  document.getElementById('tdisp').textContent=fmt(rem);
}

function toggle(){
  if(TM.running){
    clearInterval(TM.interval);TM.running=false;
    if(TM.elapsed>10)recSess(TM.elapsed);
    document.getElementById('startBtn').innerHTML='▶ Resume';
  } else {
    TM.running=true;TM.sessStart=Date.now();
    document.getElementById('startBtn').innerHTML='⏸ Pause';
    TM.interval=setInterval(()=>{
      TM.elapsed++;updateRing();
      if(TM.elapsed>=TM.dur*60){
        clearInterval(TM.interval);TM.running=false;
        recSess(TM.elapsed);
        toast(TM.mode==='focus'?'✅ Session complete! Take a break.':'☕ Break done! Back to focus.');
        setTimeout(()=>setMode(TM.mode==='focus'?'break':'focus'),900);
        document.getElementById('startBtn').innerHTML='▶ Start';
      }
    },1000);
  }
}

function resetT(){clearInterval(TM.interval);TM.running=false;TM.elapsed=0;document.getElementById('startBtn').innerHTML='▶ Start';updateRing();}
function skipT(){if(TM.elapsed>10)recSess(TM.elapsed);clearInterval(TM.interval);TM.running=false;TM.elapsed=0;document.getElementById('startBtn').innerHTML='▶ Start';setMode(TM.mode==='focus'?'break':'focus');toast('Session skipped');}

function setMode(m){
  TM.mode=m;TM.elapsed=0;TM.dur=MODES[m].def;
  clearInterval(TM.interval);TM.running=false;
  document.getElementById('startBtn').innerHTML='▶ Start';
  document.querySelectorAll('.mtab').forEach(t=>t.classList.toggle('on',t.id==='mt-'+m));
  document.getElementById('tlbl').textContent=MODES[m].lbl;
  updateRing();
}

function recSess(dur){
  if(dur<10)return;
  const s=loadSess();
  s.push({mode:TM.mode,subj:TM.subj,note:document.getElementById('snote').value.trim(),start:TM.sessStart||Date.now(),dur,timestamp:Date.now()});
  saveSess(s);updateStats();
}

function updateStats(){
  const s=loadSess();
  const today=new Date().toDateString();
  const tod=s.filter(x=>new Date(x.start).toDateString()===today);
  const fs=tod.filter(x=>x.mode==='focus').reduce((a,b)=>a+b.dur,0);
  const bs=tod.filter(x=>x.mode!=='focus').reduce((a,b)=>a+b.dur,0);
  document.getElementById('ss').textContent=tod.filter(x=>x.mode==='focus').length;
  document.getElementById('sf').textContent=fmtm(Math.floor(fs/60));
  document.getElementById('sb2').textContent=fmtm(Math.floor(bs/60));
  let streak=0,chk=new Date();
  for(let i=0;i<60;i++){const d=chk.toDateString();if(s.some(x=>new Date(x.start).toDateString()===d&&x.mode==='focus')){streak++;chk.setDate(chk.getDate()-1);}else break;}
  document.getElementById('sstr').textContent=streak+' day'+(streak!==1?'s':'');
  renderHmap(s);renderHist(s);
}

function renderHmap(s){
  const el=document.getElementById('hmap');
  const days=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push(d);}
  el.innerHTML=days.map(d=>{
    const mins=s.filter(x=>new Date(x.start).toDateString()===d.toDateString()&&x.mode==='focus').reduce((a,b)=>a+b.dur,0)/60;
    const cls=mins===0?'':mins<30?'h1':mins<60?'h2':mins<120?'h3':'h4';
    return `<div class="hday ${cls}" title="${d.toLocaleDateString()}: ${Math.round(mins)}m"><span>${['Su','Mo','Tu','We','Th','Fr','Sa'][d.getDay()]}</span></div>`;
  }).join('');
}

function renderHist(s){
  const el=document.getElementById('histList');
  if(!s.length){el.innerHTML='<div class="hist-empty">No sessions yet.<br>Start your first focus session! 🎯</div>';return;}
  el.innerHTML=[...s].reverse().slice(0,18).map((x,i)=>{
    const d=new Date(x.start);
    return `<div class="sess">
      <div class="sdot" style="background:${x.mode==='focus'?'var(--fh)':'var(--fm)'}"></div>
      <div class="sinfo">
        <div class="smain">${x.subj||'Study'}${x.note?' · '+x.note.slice(0,28):''}</div>
        <div class="ssub">${d.toLocaleDateString('en-IN',{month:'short',day:'numeric'})} · ${d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})} · ${x.mode}</div>
      </div>
      <div class="sdur">${fmt(x.dur)}</div>
      <button class="sdel" onclick="delSess(${s.length-1-i})">✕</button>
    </div>`;
  }).join('');
}

function delSess(i){const s=loadSess();s.splice(i,1);saveSess(s);updateStats();toast('Session deleted');}
function clearHist(){if(!confirm('Clear all session history?'))return;saveSess([]);updateStats();toast('History cleared');}

function buildSpills(){
  document.getElementById('spills').innerHTML=SUBJS.map(s=>
    `<button class="spill${s===TM.subj?' on':''}" onclick="setSubj_t('${s}',this)">${s}</button>`
  ).join('');
}
function setSubj_t(s,el){TM.subj=s;document.querySelectorAll('.spill').forEach(b=>b.classList.remove('on'));el.classList.add('on');}

function buildBreaks(){
  document.getElementById('bchips').innerHTML=BREAKS.map(v=>
    `<button class="bchip${v===TM.dur?' on':''}" onclick="setDur(${v},this)">${v}m</button>`
  ).join('');
}
function setDur(v,el){
  TM.dur=v;TM.elapsed=0;
  document.querySelectorAll('.bchip').forEach(b=>b.classList.remove('on'));el.classList.add('on');
  updateRing();
}

const CLS='jee_ch_v2';
function cl(){try{return JSON.parse(localStorage.getItem(CLS))||{};}catch{return{};}}
function cs(d){try{localStorage.setItem(CLS,JSON.stringify(d));}catch{}}
function ck(s,g,n){return`${s}||${g}||${n}`;}

let curS='phy',curCS='all',curF='all',curD='all',curST='all';
const FC={H:'var(--fh)',M:'var(--fm)',L:'var(--fl)'};
const FCL={H:'bfh',M:'bfm',L:'bfl'};
const DCL={E:'bde',M:'bdm',D:'bdd'};
const FL2={H:'High',M:'Med',L:'Low'};
const DL2={E:'Easy',M:'Mid',D:'Hard'};
const SIC={done:'✓',wip:'⟳',todo:''};
let svTmrs={};

function renderCh(){
  const q=(document.getElementById('srch')?.value||'').toLowerCase();
  const store=cl();
  document.getElementById('chemtabs').style.display=curS==='chem'?'':'none';
  let html='',tot=0,shown=0;
  CD[curS].forEach((g,gi)=>{
    if(curS==='chem'&&curCS!=='all'&&g.sub!==curCS)return;
    let rh='',rk=0;
    g.rows.forEach((r)=>{
      tot++;
      const k=ck(curS,g.g,r.n);
      const sv=store[k]||{};
      const st=sv.status||'todo';
      if(curF!=='all'&&r.f!==curF)return;
      if(curD!=='all'&&r.d!==curD)return;
      if(curST!=='all'&&st!==curST)return;
      if(q&&!r.n.toLowerCase().includes(q))return;
      shown++;rk++;
      const delay=(gi*0.025+rk*0.012).toFixed(2);
      const sc=st!=='todo'?`s${st.charAt(0)}`:'';
      const esc=s=>s.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
      rh+=`
        <div class="crow ${sc}" style="animation-delay:${delay}s" data-k="${k.replace(/"/g,'&quot;')}">
          <div class="ch-hdr" onclick="toggleCrow(this.parentElement)">
            <span class="chnum">${rk}</span>
            <button class="stbtn ${st}" onclick="cycSt(event,'${esc(curS)}','${esc(g.g)}','${esc(r.n)}')">${SIC[st]}</button>
            <span class="cname">${r.n}</span>
            <div class="barbg"><div class="barfill" style="width:${r.p}%;background:${FC[r.f]}"></div></div>
            <div class="bdgs">
              <span class="bdg ${FCL[r.f]}">${FL2[r.f]}</span>
              <span class="bdg ${DCL[r.d]}">${DL2[r.d]}</span>
            </div>
            <span class="xicon">▾</span>
          </div>
          <div class="chdet">
            <div class="chdet-in">
              <div class="dgrid">
                <div class="dc"><div class="dcl">Avg/Year</div><div class="dcv">${r.yr}</div></div>
                <div class="dc"><div class="dcl">Heavier in</div><div class="dcv">${r.mi}</div></div>
                <div class="dc"><div class="dcl">Study Time</div><div class="dcv">${r.hr}</div></div>
                <div class="dc"><div class="dcl">Best Book</div><div class="dcv">${r.bk}</div></div>
                <div class="dc" style="grid-column:1/-1"><div class="dcl">Most tested concept</div><div class="dcv">${r.hot}</div></div>
              </div>
              <div><div class="sl-ch">Key Topics</div><div class="ttags">${r.tp.map(t=>`<span class="ttag">${t}</span>`).join('')}</div></div>
              <div>
                <div class="sl-ch">Status</div>
                <div class="strow">
                  <button class="stopt ${st==='todo'?'a-todo':''}" onclick="setChSt('${esc(curS)}','${esc(g.g)}','${esc(r.n)}','todo')">○ Not Started</button>
                  <button class="stopt ${st==='wip'?'a-wip':''}" onclick="setChSt('${esc(curS)}','${esc(g.g)}','${esc(r.n)}','wip')">⟳ In Progress</button>
                  <button class="stopt ${st==='done'?'a-done':''}" onclick="setChSt('${esc(curS)}','${esc(g.g)}','${esc(r.n)}','done')">✓ Done</button>
                </div>
              </div>
              <div>
                <div class="sl-ch">Notes & Revision</div>
                <div class="nrow">
                  <textarea class="nta" placeholder="Notes, weak areas, reminders…" oninput="saveNote('${esc(k)}',this.value)">${sv.notes||''}</textarea>
                  <div class="dcol">
                    <div class="dlbl">Revision due</div>
                    <input type="date" class="din" value="${sv.date||''}" onchange="saveDate('${esc(k)}',this.value)">
                    <div class="svi" id="svi_${rk}_${gi}">✓ saved</div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>`;
    });
    if(rh.trim())html+=`<div class="shead">${g.g}</div>${rh}`;
  });
  document.getElementById('chCnt').textContent=`Showing ${shown} of ${tot} chapters`;
  document.getElementById('chList').innerHTML=html||'<div style="text-align:center;padding:44px;color:var(--t3)">No chapters match.</div>';
  updateProg();
}

function updateProg(){
  const store=cl();
  let done=0,wip=0,tot=0;
  ['phy','chem','math'].forEach(s=>{CD[s].forEach(g=>{g.rows.forEach(r=>{tot++;const st=store[ck(s,g.g,r.n)]?.status||'todo';if(st==='done')done++;else if(st==='wip')wip++;});});});
  const td=tot-done-wip,pct=Math.round(done/tot*100);
  document.getElementById('progChips').innerHTML=`
    <div class="pchip"><span class="pdot done"></span>${done} Done</div>
    <div class="pchip"><span class="pdot wip"></span>${wip} WIP</div>
    <div class="pchip"><span class="pdot todo"></span>${td} Todo</div>
    <div class="pchip">📊 ${pct}%</div>`;
  document.getElementById('ovFill').style.width=pct+'%';
}

function toggleCrow(el){el.classList.toggle('op');}
function cycSt(e,s,g,n){
  e.stopPropagation();
  const store=cl();const k=ck(s,g,n);
  const cur=store[k]?.status||'todo';
  const nxt=cur==='todo'?'wip':cur==='wip'?'done':'todo';
  store[k]=store[k]||{};store[k].status=nxt;cs(store);
  renderCh();toast(nxt==='done'?'✅ Chapter done!':nxt==='wip'?'⟳ In progress':'○ Marked todo');
}
function setChSt(s,g,n,st){
  const store=cl();const k=ck(s,g,n);
  store[k]=store[k]||{};store[k].status=st;cs(store);
  const row=document.querySelector(`[data-k="${k.replace(/"/g,'&quot;')}"]`);
  if(row){
    row.className=`crow${st!=='todo'?' s'+st.charAt(0):''}`+(row.classList.contains('op')?' op':'');
    const btn=row.querySelector('.stbtn');if(btn){btn.className=`stbtn ${st}`;btn.textContent=SIC[st];}
    row.querySelectorAll('.stopt').forEach(b=>{
      const isTodo=b.textContent.includes('Not'),isWip=b.textContent.includes('Progress'),isDone=b.textContent.includes('Done');
      b.className='stopt'+(isTodo&&st==='todo'?' a-todo':isWip&&st==='wip'?' a-wip':isDone&&st==='done'?' a-done':'');
    });
  }
  updateProg();toast(st==='done'?'✅ Done!':st==='wip'?'⟳ In progress':'○ Todo');
}
function saveNote(k,v){clearTimeout(svTmrs[k]);svTmrs[k]=setTimeout(()=>{const s=cl();s[k]=s[k]||{};s[k].notes=v;cs(s);},600);}
function saveDate(k,v){const s=cl();s[k]=s[k]||{};s[k].date=v;cs(s);toast('📅 Date saved');}

// Filters
function clrFB(){document.querySelectorAll('.fb').forEach(b=>b.classList.remove('on'));}
function setFreq(f,el){curF=curF===f&&f!=='all'?'all':f;curD='all';curST='all';clrFB();(curF==='all'?document.querySelector('.fa'):el).classList.add('on');renderCh();}
function setDiff(d,el){curD=curD===d?'all':d;curF='all';curST='all';clrFB();document.querySelector('.fa').classList.add('on');if(curD!=='all')el.classList.add('on');renderCh();}
function setStat(st,el){curST=curST===st?'all':st;curF='all';curD='all';clrFB();document.querySelector('.fa').classList.add('on');if(curST!=='all')el.classList.add('on');renderCh();}
function setSubj(s,el){curS=s;curCS='all';document.querySelectorAll('.stab').forEach(t=>t.classList.remove('on'));el.classList.add('on');document.querySelectorAll('.ctab').forEach(t=>{t.classList.remove('on');if(t.textContent==='All')t.classList.add('on');});renderCh();}
function setChemSub(s,el){curCS=s;document.querySelectorAll('.ctab').forEach(t=>t.classList.remove('on'));el.classList.add('on');renderCh();}

(function(){
  const th=localStorage.getItem('jee_theme')||'forest';
  applyTheme(th);buildPicker();
  if(perfMode) applyPerfMode();
  const pb = document.getElementById('perfBtn');
  if(pb) pb.style.color = perfMode ? '#a78bfa' : 'rgba(255,255,255,0.5)';
  const pg=localStorage.getItem('jee_page')||'timer';
  goPage(pg);
  buildSpills();buildBreaks();updateRing();updateStats();
  renderCh();document.querySelector('.fa').classList.add('on');
})();
</script>
